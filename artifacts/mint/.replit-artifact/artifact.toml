kind = "web"
previewPath = "/"
title = "Mint on the Avenue"
version = "1.0.0"
id = "artifacts/mint"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20509

[services.development]
run = "pnpm --filter @workspace/mint run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/mint", "run", "build" ]
publicDir = "artifacts/mint/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20509"
BASE_PATH = "/"
