kind = "web"
previewPath = "/ota/"
title = "On the Avenue"
version = "1.0.0"
id = "artifacts/on-the-avenue"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/ota/" ]
localPort = 18861

[services.development]
run = "pnpm --filter @workspace/on-the-avenue run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/on-the-avenue", "run", "build" ]
publicDir = "artifacts/on-the-avenue/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18861"
BASE_PATH = "/ota/"
